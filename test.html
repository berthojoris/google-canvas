<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maritime Radar Tracking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f14;
            color: #e0e6ed;
            overflow: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Radar Grid Background */
        .radar-grid {
            background-image:
                linear-gradient(rgba(0, 255, 200, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 200, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Radar Sweep Animation */
        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vmax;
            height: 150vmax;
            transform: translate(-50%, -50%);
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(0, 255, 150, 0.1) 30deg,
                rgba(0, 255, 150, 0.3) 45deg,
                transparent 60deg
            );
            animation: radarRotate 4s linear infinite;
            pointer-events: none;
        }

        @keyframes radarRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Pulse Animation for Markers */
        .marker-pulse {
            animation: markerPulse 2s ease-out infinite;
        }

        @keyframes markerPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* Target Lock Animation */
        .target-lock {
            animation: targetLock 1s ease-in-out infinite alternate;
        }

        @keyframes targetLock {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* Blinking Effect */
        .blink {
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Scan Line */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 150, 0.5), transparent);
            animation: scanLine 3s linear infinite;
            pointer-events: none;
        }

        @keyframes scanLine {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Glass Panel Effect */
        .glass-panel {
            background: rgba(15, 25, 35, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 200, 0.1);
        }

        /* Data Panel Header */
        .panel-header {
            background: linear-gradient(90deg, rgba(0, 255, 200, 0.1), transparent);
            border-left: 3px solid #00ffc8;
        }

        /* Ship Trail Animation */
        .ship-trail {
            stroke-dasharray: 10, 5;
            animation: dashMove 1s linear infinite;
        }

        @keyframes dashMove {
            to { stroke-dashoffset: -15; }
        }

        /* Rotating Target Brackets */
        .target-bracket {
            animation: bracketPulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes bracketPulse {
            0% { stroke-width: 2; }
            100% { stroke-width: 3; }
        }

        /* Glow Effects */
        .glow-cyan {
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.3);
        }

        .glow-orange {
            box-shadow: 0 0 20px rgba(255, 150, 0, 0.4);
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
        }

        /* Range Rings */
        .range-ring {
            border: 1px solid rgba(0, 255, 200, 0.15);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Vessel Icon Animation */
        .vessel-icon {
            animation: vesselFloat 3s ease-in-out infinite;
        }

        @keyframes vesselFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* Sidebar Item Hover */
        .sidebar-item {
            transition: all 0.3s ease;
        }
        .sidebar-item:hover {
            background: rgba(0, 255, 200, 0.1);
            border-left: 3px solid #00ffc8;
        }

        /* Data Update Animation */
        .data-update {
            animation: dataFlash 0.5s ease-out;
        }

        @keyframes dataFlash {
            0% { color: #00ffc8; }
            100% { color: inherit; }
        }

        /* Warning Indicator */
        .warning-indicator {
            animation: warningPulse 1s ease-in-out infinite;
        }

        @keyframes warningPulse {
            0%, 100% { background: rgba(255, 100, 0, 0.3); }
            50% { background: rgba(255, 100, 0, 0.6); }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden">
    <!-- Main Container -->
    <div class="flex h-full w-full">
        
        <!-- Left Sidebar -->
        <aside class="w-16 bg-[#0d1318] border-r border-cyan-900/30 flex flex-col items-center py-4 z-20">
            <div class="mb-6">
                <div class="w-10 h-10 rounded-lg bg-cyan-500/20 flex items-center justify-center border border-cyan-500/30">
                    <i data-lucide="radar" class="w-5 h-5 text-cyan-400"></i>
                </div>
            </div>
            
            <nav class="flex-1 flex flex-col gap-2 w-full px-2">
                <button class="sidebar-item w-full p-3 rounded-lg flex items-center justify-center text-cyan-400 bg-cyan-500/10 border-l-2 border-cyan-400">
                    <i data-lucide="map" class="w-5 h-5"></i>
                </button>
                <button class="sidebar-item w-full p-3 rounded-lg flex items-center justify-center text-slate-500 hover:text-cyan-400">
                    <i data-lucide="ship" class="w-5 h-5"></i>
                </button>
                <button class="sidebar-item w-full p-3 rounded-lg flex items-center justify-center text-slate-500 hover:text-cyan-400">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                </button>
                <button class="sidebar-item w-full p-3 rounded-lg flex items-center justify-center text-slate-500 hover:text-cyan-400">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </nav>
            
            <div class="mt-auto">
                <button class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-cyan-400 transition-colors">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col relative">
            
            <!-- Top Info Bar -->
            <header class="h-20 glass-panel border-b border-cyan-900/30 flex items-center px-6 gap-4 z-20">
                <!-- Current Position -->
                <div class="flex-1 panel-header p-3 rounded-r-lg">
                    <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Current Position</div>
                    <div class="font-mono text-lg font-semibold text-cyan-300 text-glow">43°00'N 41°01'E</div>
                    <div class="text-xs text-slate-500 mt-1">Last Updated: <span id="last-updated" class="text-cyan-400">Just now</span></div>
                </div>
                
                <!-- Expected Position -->
                <div class="flex-1 panel-header p-3 rounded-r-lg">
                    <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Expected Position (ETA)</div>
                    <div class="font-mono text-lg font-semibold text-cyan-300 text-glow">43°00'N 41°01'E</div>
                    <div class="text-xs text-slate-500 mt-1">29-07-2023 2:16:28</div>
                </div>
                
                <!-- Deviation Distance -->
                <div class="flex-1 panel-header p-3 rounded-r-lg">
                    <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Deviation Distance</div>
                    <div class="font-mono text-lg font-semibold text-cyan-300 text-glow">43°00'N 41°01'E</div>
                    <div class="text-xs text-slate-500 mt-1">Within acceptable range</div>
                </div>
                
                <!-- Remaining -->
                <div class="flex-1 panel-header p-3 rounded-r-lg">
                    <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Remaining</div>
                    <div class="font-mono text-lg font-semibold text-orange-400 text-glow">117 nm</div>
                    <div class="text-xs text-slate-500 mt-1">~19 hours at current speed</div>
                </div>
            </header>

            <!-- Map Controls Bar -->
            <div class="h-12 bg-[#0d1318]/80 border-b border-cyan-900/20 flex items-center px-4 gap-4 z-20">
                <button class="flex items-center gap-2 px-3 py-1.5 rounded bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-sm hover:bg-cyan-500/20 transition-colors">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <div class="flex items-center gap-3 px-4 py-1.5 rounded bg-slate-800/50 border border-slate-700">
                    <span class="text-cyan-400 font-mono text-sm">2025-09-14</span>
                    <span class="text-slate-500">12:34 UTC</span>
                    <span class="text-xs px-2 py-0.5 rounded bg-orange-500/20 text-orange-400">Past</span>
                </div>
                <button class="p-1.5 rounded hover:bg-slate-800 text-slate-400 hover:text-cyan-400 transition-colors">
                    <i data-lucide="info" class="w-4 h-4"></i>
                </button>
                
                <div class="ml-auto flex items-center gap-3">
                    <span class="text-xs text-slate-500">Layer:</span>
                    <button class="px-3 py-1.5 rounded bg-cyan-500/20 border border-cyan-500/40 text-cyan-400 text-xs">Radar</button>
                    <button class="px-3 py-1.5 rounded bg-slate-800 border border-slate-700 text-slate-400 text-xs hover:text-cyan-400">Satellite</button>
                    <button class="px-3 py-1.5 rounded bg-slate-800 border border-slate-700 text-slate-400 text-xs hover:text-cyan-400">Weather</button>
                </div>
            </div>

            <!-- Map Area -->
            <div class="flex-1 relative overflow-hidden radar-grid bg-gradient-to-br from-[#0a1620] via-[#0d1f2d] to-[#0a1620]">
                
                <!-- Radar Sweep -->
                <div class="radar-sweep"></div>
                
                <!-- Scan Line -->
                <div class="scan-line"></div>
                
                <!-- Range Rings -->
                <div class="range-ring w-[20%] h-[20%]"></div>
                <div class="range-ring w-[40%] h-[40%]"></div>
                <div class="range-ring w-[60%] h-[60%]"></div>
                <div class="range-ring w-[80%] h-[80%]"></div>
                
                <!-- Map Container -->
                <div class="absolute inset-0" id="map-container">
                    <svg class="w-full h-full" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
                        
                        <!-- Grid Lines -->
                        <defs>
                            <pattern id="smallGrid" width="50" height="50" patternUnits="userSpaceOnUse">
                                <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(0,255,200,0.05)" stroke-width="0.5"/>
                            </pattern>
                        </defs>
                        <rect width="100%" height="100%" fill="url(#smallGrid)" />
                        
                        <!-- Coastline / Land Areas (Simplified) -->
                        <path d="M 0,200 Q 150,180 200,250 T 350,300 T 500,280 T 700,320 T 900,280 L 1000,300 L 1000,600 L 0,600 Z" 
                              fill="rgba(0,30,40,0.6)" stroke="rgba(0,255,200,0.1)" stroke-width="1"/>
                        
                        <!-- Connection Lines -->
                        <line x1="200" y1="200" x2="750" y2="380" stroke="rgba(0,255,200,0.3)" stroke-width="1" stroke-dasharray="5,5" class="ship-trail"/>
                        
                        <!-- Location: Lisbon -->
                        <g transform="translate(150, 220)">
                            <circle r="4" fill="#00ffc8" class="marker-pulse"/>
                            <circle r="8" fill="none" stroke="#00ffc8" stroke-width="1" class="marker-pulse" style="animation-delay: 0.5s"/>
                            <text x="10" y="4" fill="#00ffc8" font-size="10" font-family="JetBrains Mono">LISBON</text>
                        </g>
                        
                        <!-- Location: Marseille -->
                        <g transform="translate(380, 180)">
                            <circle r="4" fill="#00ffc8" class="marker-pulse"/>
                            <circle r="8" fill="none" stroke="#00ffc8" stroke-width="1" class="marker-pulse" style="animation-delay: 0.3s"/>
                            <text x="10" y="4" fill="#00ffc8" font-size="10" font-family="JetBrains Mono">MARSEILLE</text>
                        </g>
                        
                        <!-- Location: Dubai -->
                        <g transform="translate(720, 320)">
                            <circle r="4" fill="#00ffc8" class="marker-pulse"/>
                            <circle r="8" fill="none" stroke="#00ffc8" stroke-width="1" class="marker-pulse" style="animation-delay: 0.7s"/>
                            <text x="10" y="4" fill="#00ffc8" font-size="10" font-family="JetBrains Mono">DUBAI</text>
                        </g>
                        
                        <!-- Location: Mumbai -->
                        <g transform="translate(780, 380)">
                            <circle r="4" fill="#00ffc8" class="marker-pulse"/>
                            <circle r="8" fill="none" stroke="#00ffc8" stroke-width="1" class="marker-pulse" style="animation-delay: 0.9s"/>
                            <text x="10" y="4" fill="#00ffc8" font-size="10" font-family="JetBrains Mono">MUMBAI</text>
                        </g>
                        
                        <!-- Target Markers (Orange diamonds) -->
                        <g transform="translate(450, 280)">
                            <polygon points="0,-6 6,0 0,6 -6,0" fill="#ff9600" class="blink"/>
                        </g>
                        <g transform="translate(520, 310)">
                            <polygon points="0,-6 6,0 0,6 -6,0" fill="#ff9600" class="blink" style="animation-delay: 0.2s"/>
                        </g>
                        <g transform="translate(580, 340)">
                            <polygon points="0,-6 6,0 0,6 -6,0" fill="#ff9600" class="blink" style="animation-delay: 0.4s"/>
                        </g>
                        <g transform="translate(640, 360)">
                            <polygon points="0,-6 6,0 0,6 -6,0" fill="#ff9600" class="blink" style="animation-delay: 0.6s"/>
                        </g>
                        
                        <!-- Main Vessel: Oman Al Juwairiya -->
                        <g transform="translate(550, 300)" class="vessel-icon">
                            <!-- Detection Range Circle -->
                            <circle r="60" fill="url(#vesselRange)" opacity="0.3"/>
                            
                            <!-- Vessel Icon -->
                            <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#00ffc8" class="glow-cyan"/>
                            <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#0a1620"/>
                            <path d="M-4,-4 L0,4 L4,-4 Z" fill="#00ffc8"/>
                            
                            <!-- Info Card -->
                            <g transform="translate(20, -30)">
                                <rect x="0" y="0" width="140" height="50" rx="4" fill="rgba(15,25,35,0.95)" stroke="#00ffc8" stroke-width="1"/>
                                <rect x="0" y="0" width="30" height="50" rx="4" fill="#00ffc8"/>
                                <text x="38" y="18" fill="#00ffc8" font-size="11" font-weight="600" font-family="Inter">Oman</text>
                                <text x="38" y="35" fill="#e0e6ed" font-size="11" font-family="Inter">Al Juwairiya</text>
                                <path d="M10,15 L15,25 L20,15" fill="#0a1620"/>
                            </g>
                        </g>
                        
                        <!-- Target 01 -->
                        <g transform="translate(480, 250)">
                            <!-- Target Brackets -->
                            <rect x="-25" y="-25" width="50" height="50" fill="none" stroke="#ff6400" stroke-width="2" class="target-lock"/>
                            <line x1="-35" y1="-35" x2="-20" y2="-20" stroke="#ff6400" stroke-width="2"/>
                            <line x1="35" y1="-35" x2="20" y2="-20" stroke="#ff6400" stroke-width="2"/>
                            <line x1="-35" y1="35" x2="-20" y2="20" stroke="#ff6400" stroke-width="2"/>
                            <line x1="35" y1="35" x2="20" y2="20" stroke="#ff6400" stroke-width="2"/>
                            
                            <!-- Target Label -->
                            <g transform="translate(30, -35)">
                                <rect x="0" y="0" width="90" height="24" rx="2" fill="#ff9600"/>
                                <text x="8" y="16" fill="#0a1620" font-size="10" font-weight="700" font-family="JetBrains Mono">TARGET-01</text>
                            </g>
                            
                            <!-- Crosshair -->
                            <circle r="3" fill="#ff6400" class="blink"/>
                            <line x1="-10" y1="0" x2="10" y2="0" stroke="#ff6400" stroke-width="1" opacity="0.5"/>
                            <line x1="0" y1="-10" x2="0" y2="10" stroke="#ff6400" stroke-width="1" opacity="0.5"/>
                        </g>
                        
                        <!-- Additional Target near Marseille -->
                        <g transform="translate(420, 200)">
                            <rect x="-20" y="-20" width="40" height="40" fill="none" stroke="#ff6400" stroke-width="2" class="target-lock" style="animation-delay: 0.3s"/>
                            <circle r="3" fill="#ff6400" class="blink" style="animation-delay: 0.3s"/>
                        </g>
                        
                        <!-- Target near Dubai -->
                        <g transform="translate(700, 340)">
                            <rect x="-20" y="-20" width="40" height="40" fill="none" stroke="#ff6400" stroke-width="2" class="target-lock" style="animation-delay: 0.6s"/>
                            <circle r="3" fill="#ff6400" class="blink" style="animation-delay: 0.6s"/>
                        </g>
                        
                        <!-- Gradient Definitions -->
                        <defs>
                            <radialGradient id="vesselRange" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#00ffc8" stop-opacity="0.2"/>
                                <stop offset="100%" stop-color="#00ffc8" stop-opacity="0"/>
                            </radialGradient>
                        </defs>
                    </svg>
                </div>
                
                <!-- Bottom Right Controls -->
                <div class="absolute bottom-6 right-6 flex flex-col gap-2">
                    <button class="w-10 h-10 rounded-lg bg-slate-800/80 border border-slate-700 flex items-center justify-center text-slate-400 hover:text-cyan-400 hover:border-cyan-500/50 transition-all">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                    <button class="w-10 h-10 rounded-lg bg-slate-800/80 border border-slate-700 flex items-center justify-center text-slate-400 hover:text-cyan-400 hover:border-cyan-500/50 transition-all">
                        <i data-lucide="minus" class="w-5 h-5"></i>
                    </button>
                    <button class="w-10 h-10 rounded-lg bg-slate-800/80 border border-slate-700 flex items-center justify-center text-slate-400 hover:text-cyan-400 hover:border-cyan-500/50 transition-all">
                        <i data-lucide="maximize" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <!-- Bottom Left Status -->
                <div class="absolute bottom-6 left-6 glass-panel rounded-lg p-3 border border-cyan-900/30">
                    <div class="flex items-center gap-3">
                        <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
                        <span class="text-xs text-slate-400 font-mono">SYSTEM ONLINE</span>
                        <span class="text-xs text-slate-600">|</span>
                        <span class="text-xs text-cyan-400 font-mono">5 TARGETS TRACKED</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
        
        // Simulate real-time data updates
        function updateTimestamp() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('last-updated').textContent = timeString;
        }
        
        // Update every second
        setInterval(updateTimestamp, 1000);
        
        // Simulate coordinate drift
        let baseCoords = { lat: 43.00, lon: 41.01 };
        
        function driftCoordinates() {
            baseCoords.lat += (Math.random() - 0.5) * 0.001;
            baseCoords.lon += (Math.random() - 0.5) * 0.001;
            
            const latStr = `${baseCoords.lat.toFixed(2)}°N`;
            const lonStr = `${baseCoords.lon.toFixed(2)}°E`;
            
            // Update all coordinate displays with flash effect
            const coordElements = document.querySelectorAll('.font-mono.text-lg');
            coordElements.forEach(el => {
                if (el.textContent.includes('°')) {
                    el.textContent = `${latStr} ${lonStr}`;
                    el.classList.add('data-update');
                    setTimeout(() => el.classList.remove('data-update'), 500);
                }
            });
        }
        
        // Drift coordinates every 5 seconds
        setInterval(driftCoordinates, 5000);
        
        // Simulate remaining distance countdown
        let remainingNM = 117;
        
        function updateRemaining() {
            if (remainingNM > 0) {
                remainingNM -= 0.1;
                const remainingEl = document.querySelector('.text-orange-400.text-glow');
                if (remainingEl) {
                    remainingEl.textContent = `${remainingNM.toFixed(1)} nm`;
                }
            }
        }
        
        // Update every 10 seconds
        setInterval(updateRemaining, 10000);
        
        // Add interactive map panning
        const mapContainer = document.getElementById('map-container');
        let isDragging = false;
        let startX, startY, scrollLeft, scrollTop;
        
        mapContainer.addEventListener('mousedown', (e) => {
            isDragging = true;
            mapContainer.style.cursor = 'grabbing';
        });
        
        mapContainer.addEventListener('mouseup', () => {
            isDragging = false;
            mapContainer.style.cursor = 'default';
        });
        
        mapContainer.addEventListener('mouseleave', () => {
            isDragging = false;
            mapContainer.style.cursor = 'default';
        });
    </script>
</body>
</html>
