<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Data Parser</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .input-section, .result-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .data-block {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 0 10px 10px 0;
        }
        .data-block h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .info-row {
            display: flex;
            margin-bottom: 10px;
            align-items: flex-start;
        }
        .info-label {
            font-weight: bold;
            color: #555;
            min-width: 150px;
        }
        .info-value {
            color: #333;
            flex: 1;
        }
        .flight-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .flight-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 500;
        }
        .route-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .route-badge {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 500;
        }
        .class-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .class-badge {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }
        .no-data {
            color: #999;
            font-style: italic;
        }
        .separator {
            text-align: center;
            color: #999;
            margin: 20px 0;
            font-size: 14px;
        }
        .separator::before, .separator::after {
            content: '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━';
            margin: 0 10px;
            color: #ddd;
        }
        .stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .upload-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border: 2px dashed #667eea;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .upload-section:hover {
            border-color: #764ba2;
            background: linear-gradient(135deg, #eef2f7 0%, #dde3e9 100%);
        }
        .upload-section.dragover {
            border-color: #764ba2;
            background: linear-gradient(135deg, #e8f4f8 0%, #d4e7f0 100%);
            transform: scale(1.02);
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .upload-text {
            color: #555;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .upload-hint {
            color: #888;
            font-size: 13px;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            display: inline-block;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        .upload-btn:hover {
            transform: translateY(-2px);
        }
        .file-info {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin-top: 15px;
            border-radius: 0 10px 10px 0;
            display: none;
        }
        .file-name {
            font-weight: bold;
            color: #2e7d32;
        }
        .file-size {
            color: #558b2f;
            font-size: 13px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            background: #e0e0e0;
            color: #555;
            transition: all 0.3s;
            border: none;
            font-size: 14px;
        }
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 500;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .export-btn {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            margin-left: 10px;
        }
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-box input {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            width: 300px;
            transition: all 0.3s;
        }
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .filter-count {
            margin-left: 10px;
            color: #667eea;
            font-size: 13px;
            font-weight: 500;
        }
        .data-block.hidden {
            display: none;
        }
        .data-block.highlight {
            animation: highlight 0.5s ease;
            border-left-color: #ff6b6b;
        }
        @keyframes highlight {
            0% { background: #fff3cd; }
            100% { background: #f8f9fa; }
        }
        .no-match {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 16px;
        }
        .sticky-header {
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
            padding: 15px 0;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }
        .sticky-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ Flight Data Parser</h1>
        
        <div class="input-section">
            <h3 style="margin-bottom: 15px; color: #333;">📁 Upload File Excel</h3>
            <p style="margin-bottom: 15px; color: #666; font-size: 14px;">
                Upload file Excel dengan kolom <strong>Order ID</strong>, <strong>Guest Name</strong>, dan <strong>Order Detail</strong>
            </p>
            <div class="upload-section" id="dropZone" style="margin-bottom: 0;">
                <div class="upload-icon">📊</div>
                <div class="upload-text">Drag & Drop file Excel di sini</div>
                <div class="upload-hint">atau</div>
                <label class="upload-btn">
                    Pilih File Excel
                    <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" onchange="handleFileSelect(event)">
                </label>
                <div class="upload-hint" style="margin-top: 15px;">Support: .xlsx, .xls, .csv</div>
            </div>
            <div id="fileInfo" class="file-info">
                <div class="file-name" id="fileName"></div>
                <div class="file-size" id="fileSize"></div>
            </div>
        </div>

        <div id="statsSection" class="stats" style="display: none;">
            <div class="stat-item">
                <div class="stat-value" id="totalBlocks">0</div>
                <div class="stat-label">Data Blocks</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalFlights">0</div>
                <div class="stat-label">Total Flights</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="withBookingCode">0</div>
                <div class="stat-label">With Booking Code</div>
            </div>
        </div>

        <div id="resultSection" class="result-section" style="display: none;">
            <div class="sticky-header">
                <div class="sticky-content">
                    <h3 style="color: #333; margin: 0;">📊 Hasil Parsing:</h3>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <div class="search-box">
                            <input type="text" id="searchInput" placeholder="🔍 Cari Booking Code, Passenger, Flight, Route..." onkeyup="filterResults()">
                            <span id="filterCount" class="filter-count"></span>
                        </div>
                        <button class="export-btn" onclick="exportToExcel()">📥 Export Excel</button>
                    </div>
                </div>
            </div>
            <div id="results"></div>
            <div id="excelTableContainer" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        function parseData() {
            const input = document.getElementById('inputData').value;
            const results = document.getElementById('results');
            const resultSection = document.getElementById('resultSection');
            const statsSection = document.getElementById('statsSection');
            
            if (!input.trim()) {
                alert('Silakan paste data terlebih dahulu!');
                return;
            }

            // Split data by separator (=== or ====)
            const blocks = input.split(/={3,}/).filter(b => b.trim());
            
            let html = '';
            let totalFlights = 0;
            let withBookingCode = 0;

            blocks.forEach((block, index) => {
                const parsed = parseBlock(block.trim());
                totalFlights += parsed.flights.length;
                if (parsed.bookingCode && parsed.bookingCode !== '-') withBookingCode++;

                html += `
                    <div class="data-block">
                        <h3>📦 Data Block #${index + 1}</h3>
                        <div class="info-row">
                            <span class="info-label">Booking Code:</span>
                            <span class="info-value">${parsed.bookingCode ? `<strong style="color: #667eea; font-size: 18px;">${parsed.bookingCode}</strong>` : '<span class="no-data">-</span>'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Flight Numbers:</span>
                            <span class="info-value">
                                ${parsed.flights.length > 0 
                                    ? `<div class="flight-list">${parsed.flights.map(f => `<span class="flight-badge">${f}</span>`).join('')}</div>`
                                    : '<span class="no-data">Tidak ditemukan</span>'
                                }
                            </span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Jumlah Flight:</span>
                            <span class="info-value">${parsed.flights.length} flight(s)</span>
                        </div>
                        ${parsed.classes.length > 0 ? `
                        <div class="info-row">
                            <span class="info-label">Class:</span>
                            <span class="info-value">
                                <div class="class-list">
                                    ${parsed.classes.map(c => `<span class="class-badge">${c}</span>`).join('')}
                                </div>
                            </span>
                        </div>
                        ` : ''}
                        ${parsed.routes.length > 0 ? `
                        <div class="info-row">
                            <span class="info-label">Routes:</span>
                            <span class="info-value">
                                <div class="route-list">
                                    ${parsed.routes.map(r => `<span class="route-badge">${r.date !== '-' ? r.date + ':' : ''} ${r.from} → ${r.to}</span>`).join('')}
                                </div>
                            </span>
                        </div>
                        ` : ''}
                        ${parsed.passenger ? `
                        <div class="info-row">
                            <span class="info-label">Passenger:</span>
                            <span class="info-value">${parsed.passenger}</span>
                        </div>
                        ` : ''}
                    </div>
                `;
            });

            results.innerHTML = html;
            resultSection.style.display = 'block';
            statsSection.style.display = 'flex';
            
            document.getElementById('totalBlocks').textContent = blocks.length;
            document.getElementById('totalFlights').textContent = totalFlights;
            document.getElementById('withBookingCode').textContent = withBookingCode;
        }

        function parseBlock(block) {
            const lines = block.split('\n').map(l => l.trim()).filter(l => l);
            
            let bookingCode = null;
            const flights = [];
            const routes = [];
            const classes = [];
            let passenger = null;

            // Pattern untuk booking code (6 karakter alphanumeric uppercase)
            const bookingCodePattern = /\b([A-Z0-9]{6})\b/g;
            
            // Pattern untuk flight number
            // Pattern 1: SQ 967, QF 40 (di tabel PNR)
            const flightPattern1 = /^\d*\s*\.?\s*([A-Z]{2})\s+(\d{1,4})\s+[A-Z]/;
            // Pattern 2: 2 SQ 967 Z 04NOV (format PNR)
            const flightPattern2 = /^\d+\s+([A-Z]{2})\s+(\d{1,4})\s+[A-Z]/;
            // Pattern 3: Flight Airlines: Citilink (QG 164)
            const flightPattern3 = /\(([A-Z]{2})\s+(\d{1,4})\)/;
            // Pattern 4: QF   40 K  30JAN (format dengan spasi banyak)
            const flightPattern4 = /^\d+\s*\.\s*([A-Z]{2})\s+(\d{1,4})\s+[A-Z]/;

            lines.forEach((line, idx) => {
                // Cari booking code di baris pertama atau yang mengandung timestamp
                if (idx === 0 || line.includes('/') && line.match(/\d{2}[A-Z]{3}\d{2}/)) {
                    const matches = line.match(bookingCodePattern);
                    if (matches) {
                        // Filter out yang kemungkinan bukan booking code (seperti TE001)
                        const validCodes = matches.filter(m => !m.match(/^TE\d{3}$/));
                        if (validCodes.length > 0) {
                            bookingCode = validCodes[0];
                        }
                    }
                }

                // Cari passenger name - berbagai format
                // Format: 1.INAN/KEREM MR(ADT/25JUL82) atau 1.INAN/KEREM MR
                // Format: 1.1GUIBERTEAU/SAMUEL MR
                console.log('Checking line for passenger:', line);
                
                // Pattern 1: 1.INAN/KEREM MR(ADT/25JUL82)
                let passengerMatch = line.match(/\d+\.([A-Z]+\/[A-Z\s]+MR|MS|MRS)/);
                
                // Pattern 2: 1.1GUIBERTEAU/SAMUEL MR
                if (!passengerMatch) {
                    passengerMatch = line.match(/\d+\.\d+([A-Z]+\/[A-Z\s]+MR|MS|MRS)/);
                }
                
                if (passengerMatch && !passenger) {
                    passenger = passengerMatch[1].replace(/\//g, ' ').trim();
                    console.log('Found passenger:', passenger);
                }

                // Cari flight numbers
                let flightMatch;
                
                // Pattern 2: 2 SQ 967 Z 04NOV
                const flightPattern2Full = /^\d+\s+([A-Z]{2})\s+(\d{1,4})\s+([A-Z])\s+(\d{2}[A-Z]{3})/;
                flightMatch = line.match(flightPattern2Full);
                if (flightMatch) {
                    flights.push(`${flightMatch[1]} ${flightMatch[2]}`);
                    classes.push(flightMatch[3]);
                }

                // Pattern 4: 1 . QF   40 K  30JAN
                const flightPattern4Full = /^\d+\s*\.\s*([A-Z]{2})\s+(\d{1,4})\s+([A-Z])\s+(\d{2}[A-Z]{3})/;
                flightMatch = line.match(flightPattern4Full);
                if (flightMatch) {
                    flights.push(`${flightMatch[1]} ${flightMatch[2]}`);
                    classes.push(flightMatch[3]);
                }

                // Pattern 1: . SQ 967 Z 04NOV
                const flightPattern1Full = /^\d*\s*\.?\s*([A-Z]{2})\s+(\d{1,4})\s+([A-Z])\s+(\d{2}[A-Z]{3})/;
                flightMatch = line.match(flightPattern1Full);
                if (flightMatch) {
                    flights.push(`${flightMatch[1]} ${flightMatch[2]}`);
                    classes.push(flightMatch[3]);
                }

                // Pattern 3: (QG 164)
                flightMatch = line.match(flightPattern3);
                if (flightMatch) {
                    flights.push(`${flightMatch[1]} ${flightMatch[2]}`);
                }

                // Pattern untuk rute
                // Pattern 1: 04NOV 2 CGKSIN (dengan angka setelah tanggal)
                const routePattern1 = /(\d{2}[A-Z]{3})\s+\d+\s+([A-Z]{6})/;
                // Pattern 2: 30JAN CGKMEL (tanpa angka setelah tanggal)
                const routePattern2 = /(\d{2}[A-Z]{3})\s+([A-Z]{6})/;
                // Pattern 3: Rute : MLG-HLP (format data ke-2)
                const routePattern3 = /Rute\s*[:\-]?\s*([A-Z]{3})[-\s]+([A-Z]{3})/i;
                
                let routeMatch = line.match(routePattern1);
                if (!routeMatch) {
                    routeMatch = line.match(routePattern2);
                }
                
                if (routeMatch) {
                    routes.push({
                        date: routeMatch[1],
                        route: routeMatch[2],
                        from: routeMatch[2].substring(0, 3),
                        to: routeMatch[2].substring(3, 6)
                    });
                } else {
                    // Cek pattern 3 (Rute : MLG-HLP)
                    const routeMatch3 = line.match(routePattern3);
                    if (routeMatch3) {
                        routes.push({
                            date: '-',
                            route: routeMatch3[1] + routeMatch3[2],
                            from: routeMatch3[1],
                            to: routeMatch3[2]
                        });
                    }
                }
            });

            // Jika tidak ada booking code ditemukan, cek lagi dengan pattern yang lebih longgar
            if (!bookingCode) {
                // Cek di semua baris untuk pattern 6 karakter alphanumeric
                const allText = lines.join(' ');
                const allMatches = allText.match(/\b([A-Z]{2}\d{2,4}|[A-Z0-9]{6})\b/g);
                if (allMatches) {
                    const valid = allMatches.find(m => m.length === 6 && !m.match(/^TE\d{3}$/));
                    if (valid) bookingCode = valid;
                }
            }

            return {
                bookingCode: bookingCode || '-',
                flights: [...new Set(flights)], // Remove duplicates
                routes: routes,
                classes: [...new Set(classes)], // Remove duplicates
                passenger
            };
        }

        function extractRoutes(text) {
            if (!text) return [];
            const routes = [];
            const lines = text.split('\n');
            
            // Pattern 1: 04NOV 2 CGKSIN (dengan angka setelah tanggal)
            const routePattern1 = /(\d{2}[A-Z]{3})\s+\d+\s+([A-Z]{6})/;
            // Pattern 2: 30JAN CGKMEL (tanpa angka setelah tanggal)
            const routePattern2 = /(\d{2}[A-Z]{3})\s+([A-Z]{6})/;
            // Pattern 3: Rute : MLG-HLP (format data ke-2)
            const routePattern3 = /Rute\s*[:\-]?\s*([A-Z]{3})[-\s]+([A-Z]{3})/i;
            
            lines.forEach(line => {
                let routeMatch = line.match(routePattern1);
                if (!routeMatch) {
                    routeMatch = line.match(routePattern2);
                }
                
                if (routeMatch) {
                    routes.push({
                        date: routeMatch[1],
                        route: routeMatch[2],
                        from: routeMatch[2].substring(0, 3),
                        to: routeMatch[2].substring(3, 6)
                    });
                } else {
                    // Cek pattern 3 (Rute : MLG-HLP)
                    const routeMatch3 = line.match(routePattern3);
                    if (routeMatch3) {
                        routes.push({
                            date: '-',
                            route: routeMatch3[1] + routeMatch3[2],
                            from: routeMatch3[1],
                            to: routeMatch3[2]
                        });
                    }
                }
            });
            
            return routes;
        }

        function clearData() {
            document.getElementById('inputData').value = '';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('statsSection').style.display = 'none';
        }

        // Excel parsing data storage
        let parsedExcelData = [];

        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');
        }

        // Drag and drop handlers
        const dropZone = document.getElementById('dropZone');
        
        if (dropZone) {
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            });
            
            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            });
            
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    processExcelFile(files[0]);
                }
            });
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                processExcelFile(file);
            }
        }

        function processExcelFile(file) {
            console.log('Processing file:', file.name, 'Size:', file.size);
            
            // Show file info
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            
            console.log('Elements found:', { fileInfo: !!fileInfo, fileName: !!fileName, fileSize: !!fileSize });
            
            if (fileName && fileSize && fileInfo) {
                fileName.textContent = file.name;
                fileSize.textContent = formatFileSize(file.size);
                fileInfo.style.display = 'block';
                console.log('File info displayed successfully');
            } else {
                console.error('File info elements not found!');
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                // Get first sheet
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                
                parseExcelData(jsonData);
            };
            reader.readAsArrayBuffer(file);
        }

        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function parseExcelData(data) {
            parsedExcelData = [];
            
            console.log('Total rows in Excel:', data.length - 1); // Minus header
            
            // Find column indices - prioritize kolom "R" atau "Order Detail"
            let orderDetailCol = -1;
            let guestNameCol = -1;
            let orderIdCol = -1;
            const headers = data[0] || [];
            
            console.log('Headers found:', headers.map((h, i) => `${i}:${h}`).join(', '));
            
            headers.forEach((header, idx) => {
                const h = String(header).toLowerCase().trim();
                // Cari kolom "r" atau "order detail"
                if (h === 'r' || h.includes('order detail') || h.includes('orderdetail')) {
                    orderDetailCol = idx;
                    console.log('Found Order Detail column at index:', idx);
                }
                // Cari kolom "guest name"
                if (h.includes('guest name') || h === 'guestname') {
                    guestNameCol = idx;
                    console.log('Found Guest Name column at index:', idx);
                }
                // Cari kolom "order id" atau kolom B (index 1)
                if (h === 'order id' || h === 'orderid' || idx === 1) {
                    orderIdCol = idx;
                    console.log('Found Order ID column at index:', idx);
                }
            });

            let emptyCount = 0;
            let noMatchCount = 0;
            let successCount = 0;

            // Process each row
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length === 0) {
                    emptyCount++;
                    continue;
                }

                let orderDetailData = '';

                // Ambil data dari kolom "R" atau "Order Detail"
                if (orderDetailCol >= 0) {
                    orderDetailData = String(row[orderDetailCol] || '');
                }

                // Jika tidak ada di kolom spesifik, cari di semua kolom untuk pola PNR
                if (!orderDetailData) {
                    row.forEach(cell => {
                        const cellStr = String(cell || '');
                        // Cek apakah cell mengandung pola PNR/flight data
                        if (cellStr.match(/\d{2}[A-Z]{3}/) && cellStr.match(/[A-Z]{2}\s*\d{1,4}/)) {
                            orderDetailData = cellStr;
                        }
                    });
                }

                // Parse data dari Order Detail
                const parsedBlock = parseBlockFromText(orderDetailData);

                // Ambil passenger dari kolom Guest Name jika ada
                let passengerName = parsedBlock.passenger;
                if (!passengerName && guestNameCol >= 0) {
                    passengerName = String(row[guestNameCol] || '').trim();
                }

                // Ambil Order ID dari kolom B atau Order ID
                let orderId = '';
                if (orderIdCol >= 0) {
                    orderId = String(row[orderIdCol] || '').trim();
                }

                // Hanya terima data FLIGHT - skip hotel dan lainnya
                // Cek apakah data mengandung pola flight (kode maskapai + nomor)
                // Format 1: (XX 123) - dengan tanda kurung
                // Format 2: SQ 967 - tanpa tanda kurung
                const hasFlightPatternParen = orderDetailData.match(/\([A-Z]{2}\s+\d{1,4}/);
                const hasFlightPatternPlain = orderDetailData.match(/\b[A-Z]{2}\s+\d{1,4}\b/);
                const hasFlightPattern = hasFlightPatternParen || hasFlightPatternPlain;
                
                if (hasFlightPattern && parsedBlock.flights.length > 0) {
                    parsedExcelData.push({
                        row: i,
                        orderId: orderId,
                        bookingCode: parsedBlock.bookingCode,
                        flights: parsedBlock.flights,
                        routes: parsedBlock.routes,
                        classes: parsedBlock.classes,
                        passenger: passengerName,
                        rawData: orderDetailData
                    });
                    successCount++;
                } else {
                    noMatchCount++;
                }
            }

            console.log('Parsing summary:', {
                totalRows: data.length - 1,
                emptyRows: emptyCount,
                noMatch: noMatchCount,
                success: successCount,
                parsedData: parsedExcelData.length
            });

            displayExcelResults();
        }

        // Parse block untuk data dari Excel (sama dengan parseBlock tapi untuk single text)
        function parseBlockFromText(text) {
            if (!text) {
                return { bookingCode: '-', flights: [], routes: [], classes: [], passenger: null };
            }
            
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
            
            let bookingCode = null;
            const flights = [];
            const routes = [];
            const classes = [];
            let passenger = null;

            // Pattern untuk booking code (6 karakter alphanumeric uppercase)
            const bookingCodePattern = /\b([A-Z0-9]{6})\b/g;

            lines.forEach((line, idx) => {
                // Cari booking code di baris pertama atau yang mengandung timestamp
                if (idx === 0 || (line.includes('/') && line.match(/\d{2}[A-Z]{3}\d{2}/))) {
                    const matches = line.match(bookingCodePattern);
                    if (matches) {
                        const validCodes = matches.filter(m => !m.match(/^TE\d{3}$/));
                        if (validCodes.length > 0) {
                            bookingCode = validCodes[0];
                        }
                    }
                }

                // Cari passenger name - berbagai format
                // Format: 1.INAN/KEREM MR(ADT/25JUL82) atau 1.INAN/KEREM MR
                // Format: 1.1GUIBERTEAU/SAMUEL MR
                console.log('parseBlockFromText - Checking line for passenger:', line);
                
                // Pattern 1: 1.INAN/KEREM MR(ADT/25JUL82)
                let passengerMatch = line.match(/\d+\.([A-Z]+\/[A-Z\s]+MR|MS|MRS)/);
                
                // Pattern 2: 1.1GUIBERTEAU/SAMUEL MR
                if (!passengerMatch) {
                    passengerMatch = line.match(/\d+\.\d+([A-Z]+\/[A-Z\s]+MR|MS|MRS)/);
                }
                
                if (passengerMatch && !passenger) {
                    passenger = passengerMatch[1].replace(/\//g, ' ').trim();
                    console.log('parseBlockFromText - Found passenger:', passenger);
                }

                // Pattern untuk flight dengan class
                // Pattern: 2 SQ 967 Z 04NOV
                const flightPatternFull = /^\d+\s+([A-Z]{2})\s+(\d{1,4})\s+([A-Z])\s+(\d{2}[A-Z]{3})/;
                let flightMatch = line.match(flightPatternFull);
                if (flightMatch) {
                    flights.push(`${flightMatch[1]} ${flightMatch[2]}`);
                    classes.push(flightMatch[3]);
                }

                // Pattern: 1 . QF   40 K  30JAN
                const flightPatternDot = /^\d+\s*\.\s*([A-Z]{2})\s+(\d{1,4})\s+([A-Z])\s+(\d{2}[A-Z]{3})/;
                flightMatch = line.match(flightPatternDot);
                if (flightMatch) {
                    flights.push(`${flightMatch[1]} ${flightMatch[2]}`);
                    classes.push(flightMatch[3]);
                }

                // Pattern: (QG 164) atau (JT 941/JT 662 depart)
                const flightPatternParen = /\(([A-Z]{2})\s+(\d{1,4})\)/g;
                let flightMatchAll;
                while ((flightMatchAll = flightPatternParen.exec(line)) !== null) {
                    const flightCode = `${flightMatchAll[1]} ${flightMatchAll[2]}`;
                    if (!flights.includes(flightCode)) {
                        flights.push(flightCode);
                    }
                }
                
                // Pattern maskapai dengan format: MASKAPAI (XX 123 depart)
                const airlinePattern = /([A-Z\s]+)\s*\(([A-Z]{2})\s+(\d{1,4})/g;
                let airlineMatch;
                while ((airlineMatch = airlinePattern.exec(line)) !== null) {
                    const flightCode = `${airlineMatch[2]} ${airlineMatch[3]}`;
                    if (!flights.includes(flightCode)) {
                        flights.push(flightCode);
                    }
                }

                // Pattern untuk rute
                const routePattern1 = /(\d{2}[A-Z]{3})\s+\d+\s+([A-Z]{6})/;
                const routePattern2 = /(\d{2}[A-Z]{3})\s+([A-Z]{6})/;
                const routePattern3 = /Rute\s*[:\-]?\s*([A-Z]{3})[-\s]+([A-Z]{3})/i;
                
                let routeMatch = line.match(routePattern1);
                if (!routeMatch) {
                    routeMatch = line.match(routePattern2);
                }
                
                if (routeMatch) {
                    routes.push({
                        date: routeMatch[1],
                        route: routeMatch[2],
                        from: routeMatch[2].substring(0, 3),
                        to: routeMatch[2].substring(3, 6)
                    });
                } else {
                    const routeMatch3 = line.match(routePattern3);
                    if (routeMatch3) {
                        routes.push({
                            date: '-',
                            route: routeMatch3[1] + routeMatch3[2],
                            from: routeMatch3[1],
                            to: routeMatch3[2]
                        });
                    }
                }
            });

            // Jika tidak ada booking code ditemukan, cek lagi dengan pattern yang lebih longgar
            if (!bookingCode) {
                const allText = lines.join(' ');
                const allMatches = allText.match(/\b([A-Z]{2}\d{2,4}|[A-Z0-9]{6})\b/g);
                if (allMatches) {
                    const valid = allMatches.find(m => m.length === 6 && !m.match(/^TE\d{3}$/));
                    if (valid) bookingCode = valid;
                }
            }

            return {
                bookingCode: bookingCode || '-',
                flights: [...new Set(flights)],
                routes: routes,
                classes: [...new Set(classes)],
                passenger
            };
        }

        function extractBookingCode(text) {
            if (!text) return null;
            const match = text.match(/\b([A-Z0-9]{6})\b/);
            if (match && !match[0].match(/^TE\d{3}$/)) {
                return match[0];
            }
            return null;
        }

        function extractFlights(text) {
            if (!text) return [];
            const flights = [];
            const patterns = [
                /([A-Z]{2})\s+(\d{1,4})/g,
                /([A-Z]{2})(\d{1,4})/g
            ];
            
            patterns.forEach(pattern => {
                let match;
                while ((match = pattern.exec(text)) !== null) {
                    flights.push(`${match[1]} ${match[2]}`);
                }
            });
            
            return [...new Set(flights)];
        }

        function displayExcelResults() {
            const results = document.getElementById('results');
            const resultSection = document.getElementById('resultSection');
            const statsSection = document.getElementById('statsSection');
            const tableContainer = document.getElementById('excelTableContainer');

            if (parsedExcelData.length === 0) {
                results.innerHTML = '<div class="no-data">Tidak ada data flight ditemukan dalam file Excel.</div>';
                resultSection.style.display = 'block';
                return;
            }

            // Update stats
            const totalFlights = parsedExcelData.reduce((sum, d) => sum + d.flights.length, 0);
            const withBookingCode = parsedExcelData.filter(d => d.bookingCode !== '-').length;
            
            document.getElementById('totalBlocks').textContent = parsedExcelData.length;
            document.getElementById('totalFlights').textContent = totalFlights;
            document.getElementById('withBookingCode').textContent = withBookingCode;

            // Create table
            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Order ID</th>
                            <th>Booking Code</th>
                            <th>Passenger</th>
                            <th>Flight Numbers</th>
                            <th>Class</th>
                            <th>Routes</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            parsedExcelData.forEach((data, idx) => {
                tableHTML += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${data.orderId || '<span class="no-data">-</span>'}</td>
                        <td><strong style="color: #667eea;">${data.bookingCode}</strong></td>
                        <td>${data.passenger || '<span class="no-data">-</span>'}</td>
                        <td>
                            ${data.flights.length > 0
                                ? `<div class="flight-list">${data.flights.map(f => `<span class="flight-badge">${f}</span>`).join('')}</div>`
                                : '<span class="no-data">-</span>'
                            }
                        </td>
                        <td>
                            ${data.classes.length > 0
                                ? `<div class="class-list">${data.classes.map(c => `<span class="class-badge">${c}</span>`).join('')}</div>`
                                : '<span class="no-data">-</span>'
                            }
                        </td>
                        <td>
                            ${data.routes.length > 0
                                ? `<div class="route-list">${data.routes.map(r => `<span class="route-badge">${r.date !== '-' ? r.date + ': ' : ''}${r.from} → ${r.to}</span>`).join('')}</div>`
                                : '<span class="no-data">-</span>'
                            }
                        </td>
                    </tr>
                `;
            });

            tableHTML += '</tbody></table>';
            tableContainer.innerHTML = tableHTML;

            // Calculate stats - hanya untuk flight
            const withPassenger = parsedExcelData.filter(d => d.passenger).length;
            const withRoutes = parsedExcelData.filter(d => d.routes.length > 0).length;
            
            results.innerHTML = `
                <div class="data-block">
                    <h3>✈️ Data Flight dari Excel</h3>
                    <p><strong>Total ${parsedExcelData.length} data flight berhasil di-parse.</strong></p>
                    <div style="margin-top: 10px; font-size: 13px; color: #666;">
                        <div>✓ Dengan Booking Code: ${withBookingCode}</div>
                        <div>✓ Dengan Passenger: ${withPassenger}</div>
                        <div>✓ Dengan Route: ${withRoutes}</div>
                    </div>
                </div>
            `;

            resultSection.style.display = 'block';
            statsSection.style.display = 'flex';
        }

        function exportToExcel() {
            if (parsedExcelData.length === 0) {
                alert('Tidak ada data untuk diexport!');
                return;
            }

            const exportData = parsedExcelData.map((d, idx) => ({
                'No': idx + 1,
                'Order ID': d.orderId || '-',
                'Booking Code': d.bookingCode,
                'Passenger': d.passenger || '-',
                'Flight Numbers': d.flights.join(', '),
                'Class': d.classes.join(', '),
                'Routes': d.routes.map(r => `${r.date !== '-' ? r.date + ': ' : ''}${r.from}-${r.to}`).join(', ')
            }));

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Flight Data');
            XLSX.writeFile(wb, 'flight_data_parsed.xlsx');
        }

        // Store parsed data for filtering
        let currentParsedData = [];

        // Filter function
        function filterResults() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const dataBlocks = document.querySelectorAll('.data-block');
            const tableRows = document.querySelectorAll('#excelTableContainer tbody tr');
            const filterCount = document.getElementById('filterCount');
            
            if (!searchTerm) {
                dataBlocks.forEach(block => {
                    block.classList.remove('hidden', 'highlight');
                });
                tableRows.forEach(row => {
                    row.style.display = '';
                });
                filterCount.textContent = '';
                return;
            }

            let visibleCount = 0;
            
            // Filter data blocks (paste text mode)
            dataBlocks.forEach(block => {
                const text = block.textContent.toLowerCase();
                
                // Cari semua info-row untuk mendapatkan passenger
                const infoRows = block.querySelectorAll('.info-row');
                let passenger = '';
                let bookingCode = '';
                
                infoRows.forEach(row => {
                    const label = row.querySelector('.info-label')?.textContent.trim() || '';
                    const value = row.querySelector('.info-value')?.textContent.trim() || '';
                    
                    if (label.includes('Passenger')) {
                        passenger = value.toLowerCase();
                    }
                    if (label.includes('Booking Code')) {
                        bookingCode = value.toLowerCase();
                    }
                });
                
                const flights = Array.from(block.querySelectorAll('.flight-badge')).map(b => b.textContent.toLowerCase()).join(' ');
                const routes = Array.from(block.querySelectorAll('.route-badge')).map(b => b.textContent.toLowerCase()).join(' ');
                
                // Debug: log passenger value
                if (passenger && passenger.includes('inan')) {
                    console.log('Found passenger in block:', passenger, 'Search term:', searchTerm);
                }
                
                // Search in booking code, flights, routes, passenger
                const match = bookingCode.includes(searchTerm) || 
                             flights.includes(searchTerm) || 
                             routes.includes(searchTerm) ||
                             passenger.includes(searchTerm) ||
                             text.includes(searchTerm);
                
                if (match) {
                    block.classList.remove('hidden');
                    block.classList.add('highlight');
                    visibleCount++;
                    
                    // Remove highlight after animation
                    setTimeout(() => {
                        block.classList.remove('highlight');
                    }, 500);
                } else {
                    block.classList.add('hidden');
                }
            });

            // Filter table rows (Excel upload mode)
            tableRows.forEach(row => {
                const cells = row.querySelectorAll('td');
                // Kolom: 0=No, 1=Booking Code, 2=Passenger, 3=Flight Numbers, 4=Class, 5=Routes
                if (cells.length >= 6) {
                    const bookingCode = cells[1]?.textContent.toLowerCase().trim() || '';
                    const passenger = cells[2]?.textContent.toLowerCase().trim() || '';
                    const flights = cells[3]?.textContent.toLowerCase().trim() || '';
                    const classes = cells[4]?.textContent.toLowerCase().trim() || '';
                    const routes = cells[5]?.textContent.toLowerCase().trim() || '';
                    
                    const match = bookingCode.includes(searchTerm) ||
                                 passenger.includes(searchTerm) ||
                                 flights.includes(searchTerm) ||
                                 classes.includes(searchTerm) ||
                                 routes.includes(searchTerm);
                    
                    if (match) {
                        row.style.display = '';
                        visibleCount++;
                    } else {
                        row.style.display = 'none';
                    }
                }
            });

            filterCount.textContent = visibleCount > 0 ? `(${visibleCount} ditemukan)` : '(tidak ditemukan)';
            
            // Show no match message if all hidden
            const results = document.getElementById('results');
            const existingNoMatch = results.querySelector('.no-match');
            
            if (visibleCount === 0 && !existingNoMatch) {
                const noMatch = document.createElement('div');
                noMatch.className = 'no-match';
                noMatch.innerHTML = `🔍 Tidak ada data yang cocok dengan "${searchTerm}"`;
                results.appendChild(noMatch);
            } else if (visibleCount > 0 && existingNoMatch) {
                existingNoMatch.remove();
            }
        }

        // Auto-parse saat load - hanya jika ada data di textarea
        window.onload = function() {
            const inputData = document.getElementById('inputData').value;
            if (inputData && inputData.trim()) {
                parseData();
            }
        };
    </script>
